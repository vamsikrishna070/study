<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyArena — a personal academic workspace." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StudyArena</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('study-arena-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
